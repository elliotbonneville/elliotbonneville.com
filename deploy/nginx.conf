server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/blog/public;
    index index.html;
    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript;
}
server {
    root /var/www/blog/public;
    index index.html;
    server_name elliotbonneville.com www.elliotbonneville.com; # managed by Certbot


    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript;


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elliotbonneville.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elliotbonneville.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}server {
    if ($host = www.elliotbonneville.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = elliotbonneville.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name elliotbonneville.com www.elliotbonneville.com;
    return 404; # managed by Certbot




}