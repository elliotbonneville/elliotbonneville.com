<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="What the bracket screw goes into">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#a55226"/></marker></defs>
<rect width="1100" height="650" fill="#f8faf8"/><g font-family="Arial, sans-serif" fill="#173e3b">
<text x="40" y="48" font-size="29" font-weight="bold">What the bracket screw goes into</text>
<text x="40" y="81" font-size="18">Cross-section of a captured slot nut; spring and threads omitted for clarity</text><rect x="75" y="295" width="330" height="205" rx="2" fill="#d7dfdd" stroke="#173e3b" stroke-width="2"/><path d="M190 295 V320 H160 V380 H320 V320 H290 V295" fill="#f8faf8" stroke="#173e3b" stroke-width="2"/><rect x="125" y="269" width="230" height="26" rx="2" fill="#bbcfbf" stroke="#173e3b" stroke-width="2"/><rect x="172" y="320" width="136" height="29" rx="2" fill="#d9b96f" stroke="#173e3b" stroke-width="2"/><rect x="230" y="269" width="20" height="76" rx="2" fill="#a7adb0" stroke="#173e3b" stroke-width="2"/><rect x="207" y="241" width="66" height="28" rx="2" fill="#a7adb0" stroke="#173e3b" stroke-width="2"/><line x1="240" y1="115" x2="240" y2="231" stroke="#a55226" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="195" font-size="20">Turn the screw from outside</text><text x="420" y="268" font-size="20">Bracket rests against the extrusion face</text><text x="420" y="351" font-size="20">Nut sits under BOTH slot lips</text><text x="420" y="392" font-size="20">Tightening pulls it against those lips</text><text x="420" y="457" font-size="20">No nut behind the whole extrusion</text><text x="420" y="487" font-size="20">No tapping or access hole in the extrusion</text><text x="75" y="548" font-size="22">Practice this on an empty rail first.</text><text x="75" y="580" font-size="18">M5 spring nuts hold position; M3 compact nuts need separate positioning.</text>
<text x="40" y="625" font-size="16">Assembly schematic · not to scale · delivered fit and tightening requirements still apply</text></g></svg>