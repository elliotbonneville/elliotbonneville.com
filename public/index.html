<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elliot Bonneville</title>
  <meta name="description" content="A minimal coding blog">
  <style>/* Typography - Golden ratio */
body {
  font: 16px/1.618 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  max-width: 65ch;
  margin: 40px auto;
  padding: 0 20px;
  color: #000;
  background: #fff;
}

/* Navigation */
nav {
  margin-bottom: 3em;
  padding-bottom: 1em;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

nav h1 {
  font-size: 1em;
  font-weight: normal;
  margin: 0;
}

/* Links */
a { 
  color: #0000EE; 
  text-decoration: underline;
}

a:visited { 
  color: #551A8B; 
}

/* Headings */
h1, h2, h3, h4, h5, h6 {
  margin: 1.5em 0 0.5em;
  line-height: 1.2;
}

article header h1 {
  margin-top: 0;
}

article header time {
  color: #666;
  font-size: 0.9em;
}

/* Code blocks */
pre {
  background: #f6f6f6;
  padding: 1em;
  overflow-x: auto;
  margin: 1em 0;
  line-height: 1.45;
}

code {
  font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, monospace;
  font-size: 0.9em;
}

p code {
  background: #f6f6f6;
  padding: 0.2em 0.4em;
}

/* Prism syntax highlighting */
.token.comment,
.token.prolog,
.token.doctype,
.token.cdata {
  color: #708090;
}

.token.punctuation {
  color: #999;
}

.token.property,
.token.tag,
.token.boolean,
.token.number,
.token.constant,
.token.symbol,
.token.deleted {
  color: #905;
}

.token.selector,
.token.attr-name,
.token.string,
.token.char,
.token.builtin,
.token.inserted {
  color: #690;
}

.token.operator,
.token.entity,
.token.url,
.language-css .token.string,
.style .token.string {
  color: #9a6e3a;
}

.token.atrule,
.token.attr-value,
.token.keyword {
  color: #07a;
}

.token.function,
.token.class-name {
  color: #DD4A68;
}

.token.regex,
.token.important,
.token.variable {
  color: #e90;
}

/* Interactive examples */
.example {
  margin: 2em 0;
  border-left: 3px solid #0000EE;
  padding-left: 1em;
}

.example button {
  font: inherit;
  padding: 0.5em 1em;
  cursor: pointer;
  background: #fff;
  border: 1px solid #000;
}

.example button:hover {
  background: #f6f6f6;
}

.example input, .example textarea {
  font: inherit;
  padding: 0.5em;
  border: 1px solid #ccc;
}

.example textarea {
  font-family: ui-monospace, monospace;
  width: 100%;
  min-height: 100px;
}

/* Post list */
.post-item {
  margin: 1.5em 0;
}

.post-item time {
  color: #666;
  font-size: 0.9em;
  display: block;
}

/* Mobile */
@media (max-width: 600px) {
  body { 
    font-size: 18px;
    margin: 20px auto;
  }
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  body { 
    background: #000; 
    color: #fff; 
  }
  
  nav {
    border-color: #333;
  }
  
  pre, p code { 
    background: #111; 
  }
  
  a { 
    color: #6DB3F2; 
  }
  
  a:visited { 
    color: #9B79C7; 
  }
  
  .example {
    border-color: #6DB3F2;
  }
  
  .example button {
    background: #000;
    border-color: #fff;
    color: #fff;
  }
  
  .example button:hover {
    background: #111;
  }
  
  .example input, .example textarea {
    background: #111;
    border-color: #333;
    color: #fff;
  }
  
  article header time, .post-item time {
    color: #999;
  }
  
  /* Syntax highlighting in dark mode */
  .token.comment,
  .token.prolog,
  .token.doctype,
  .token.cdata {
    color: #8292a2;
  }
  
  .token.punctuation {
    color: #a1a1a1;
  }
  
  .token.property,
  .token.tag,
  .token.boolean,
  .token.number,
  .token.constant,
  .token.symbol {
    color: #f97583;
  }
  
  .token.selector,
  .token.attr-name,
  .token.string,
  .token.char,
  .token.builtin {
    color: #9ecbff;
  }
  
  .token.operator,
  .token.entity,
  .token.url {
    color: #ffab70;
  }
  
  .token.atrule,
  .token.attr-value,
  .token.keyword {
    color: #f97583;
  }
  
  .token.function,
  .token.class-name {
    color: #b392f0;
  }
  
  .token.regex,
  .token.important,
  .token.variable {
    color: #ffab70;
  }
}</style>
</head>
<body>
  <nav>
    <h1>Elliot Bonneville</h1>
    <a href="/rss.xml">RSS</a>
  </nav>
  <main>
    
    <div class="post-item">
      <time>January 19, 2024</time>
      <a href="/async-await-patterns/">Async/Await Patterns You Should Know</a>
    </div>
    <div class="post-item">
      <time>January 14, 2024</time>
      <a href="/understanding-closures/">Understanding JavaScript Closures</a>
    </div>
    <div class="post-item">
      <time>January 9, 2024</time>
      <a href="/hello-world/">Hello World</a>
    </div>
  </main>
</body>
</html>
